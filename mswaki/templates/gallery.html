<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery – Mswaki Transport</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset and base */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

    body {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("/static/images/mswaki.jpg") no-repeat center center fixed;
      background-size: cover; 
      color:#fff; 
      min-height:100vh;
    }

    /* Navbar */
    nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(0,0,0,0.7); position:relative; }
    nav .brand { font-size:1.8rem; font-weight:700; color:#00aaff; text-decoration:none; }
    nav .nav-links { display:flex; gap:1rem; align-items:center; }
    nav .nav-links a { color:#fff; padding:0.5rem 1rem; border-radius:5px; transition:0.3s; text-decoration:none; }
    nav .nav-links a:hover, nav .nav-links a.active { background:#00aaff; color:#000; }
    nav .btn-primary { background:#00aaff; color:#000; font-weight:600; }
    .hamburger { display:none; flex-direction:column; cursor:pointer; gap:5px; }
    .hamburger span { width:25px; height:3px; background:#00aaff; border-radius:2px; }

    /* Responsive Navbar */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .nav-links {
        position: absolute;
        top: 100%;
        right: 0;
        background: rgba(0,0,0,0.8);
        flex-direction: column;
        width: 200px;
        display: none;
        padding: 1rem;
      }
      .nav-links.active { display: flex; }
      .nav-links a { margin: 0.5rem 0; }
    }

    /* Hero */
    .hero {
      padding: 6rem 2rem;
      text-align: center;
    }
    .hero h1 { font-size:2.5rem; margin-bottom:1rem; color:#00aaff; }
    .hero p { font-size:1.1rem; max-width:700px; margin:auto; line-height:1.7; }

    /* Gallery Grid */
    .gallery-grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:15px;
      max-width:1000px;
      margin:3rem auto;
      padding:0 1rem;
    }
    .gallery-item { overflow:hidden; border-radius:12px; transition:0.3s; }
    .gallery-item img { width:100%; height:200px; object-fit:cover; display:block; transition:transform 0.3s ease; }
    .gallery-item:hover img { transform: scale(1.05); }

    /* Footer */
    footer { text-align:center; margin:3rem 0 1rem; padding:1rem; background:rgba(0,0,0,0.7); color:#aaa; font-size:0.9rem; }
  </style>

</head>

<body>

<nav>
  <a href="{{ url_for('routes.user_dashboard') }}" class="brand">Mswaki</a>
  <div class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  <div class="nav-links" id="navLinks">
      <a href="{{ url_for('routes.user_dashboard') }}">Home</a>
      <a href="{{ url_for('routes.about') }}">About Us</a>
      <a class="active" href="{{ url_for('routes.gallery') }}">Gallery</a>
      <a href="{{ url_for('routes.book_vehicle') }}">Book Ride</a>
      <a href="{{ url_for('routes.contact_team') }}">Contact Team</a>
      <a href="{{ url_for('routes.report_misbehavior') }}">Report</a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('routes.logout') }}" class="btn btn-primary">Logout</a>
      {% endif %}
  </div>
</nav>

<section class="hero gallery-hero">
  <h1>Our Gallery</h1>
  <p>A glimpse of our fleet and services.</p>
</section>

<section class="gallery-grid">
  <div class="gallery-item"><img src="/static/images/coast.jpg" alt=""></div>
  <div class="gallery-item"><img src="/static/images/kitui.jpg" alt=""></div>
  <div class="gallery-item"><img src="/static/images/nakuru.jpg" alt=""></div>
  <div class="gallery-item"><img src="/static/images/vehicle1.jpg" alt=""></div>
  <div class="gallery-item"><img src="/static/images/vehicle2.jpg" alt=""></div>
  <div class="gallery-item"><img src="/static/images/vehicle3.jpg" alt=""></div>
</section>

<footer>
  <p>&copy; {{ current_year or 2025 }} Mswaki Transport. All rights reserved.</p>
</footer>

<script>
function toggleMenu() {
  const nav = document.getElementById('navLinks');
  nav.classList.toggle('active');
}
</script>

</body>
</html>
