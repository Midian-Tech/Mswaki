<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mswaki Admin{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">

    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="admin-container">
        <!-- Top Header -->
        <header class="admin-top-header">
            <div class="admin-top-header-content">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="admin-logo">
                    <i class="fas fa-bus"></i>
                    <span>Mswaki Admin</span>
                </div>
                <div class="admin-user-menu">
                    <a href="{{ url_for('routes.logout') }}" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-bus"></i>
                    <span>Mswaki Admin</span>
                </div>
                <button class="mobile-menu-btn" id="mobileMenuBtnSidebar" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="{{ url_for('routes.admin_dashboard') }}" class="nav-link {% if request.endpoint == 'routes.admin_dashboard' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="{{ url_for('routes.admin_drivers') }}" class="nav-link {% if 'admin_drivers' in request.endpoint %}active{% endif %}">
                        <i class="fas fa-users"></i>
                        <span>Drivers</span>
                    </a>
                    <a href="{{ url_for('routes.admin_vehicles') }}" class="nav-link {% if 'admin_vehicles' in request.endpoint %}active{% endif %}">
                        <i class="fas fa-car"></i>
                        <span>Vehicles</span>
                    </a>
                    <a href="{{ url_for('routes.admin_bookings') }}" class="nav-link {% if 'admin_bookings' in request.endpoint %}active{% endif %}">
                        <i class="fas fa-calendar-check"></i>
                        <span>Bookings</span>
                    </a>
                    <a href="{{ url_for('routes.admin_finance') }}" class="nav-link {% if 'admin_finance' in request.endpoint %}active{% endif %}">
                        <i class="fas fa-chart-line"></i>
                        <span>Finance</span>
                    </a>
                    <a href="{{ url_for('routes.admin_misbehavior_reports') }}" class="nav-link {% if 'admin_misbehavior_reports' in request.endpoint %}active{% endif %}">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Misbehavior Reports</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>

 <script>
document.addEventListener("DOMContentLoaded", () => {
    const menuBtn = document.querySelector(".mobile-menu-btn");
    const sidebar = document.querySelector(".admin-sidebar");
    const overlay = document.querySelector(".mobile-menu-overlay");
    const body = document.body;

    // Toggle sidebar
    menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("mobile-open");
        overlay.classList.toggle("active");
        body.classList.toggle("menu-open");
    });

    // Close sidebar when clicking outside
    overlay.addEventListener("click", () => {
        sidebar.classList.remove("mobile-open");
        overlay.classList.remove("active");
        body.classList.remove("menu-open");
    });
});
</script>




    {% block scripts %}{% endblock %}
</body>
</html>
