<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mswaki Register</title>
  <style>
    /* Reset & base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f0f9ff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    .auth-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 30px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-logo {
      width: 80px;
      margin-bottom: 10px;
    }

    .auth-header h1 {
      font-size: 1.5rem;
      color: #333;
    }

    .auth-header p.muted {
      color: #777;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      border-color: #43e97b;
      outline: none;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #4facfe;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #2ecc71;
    }

    .muted {
      color: #666;
      font-size: 0.85rem;
    }

    .link {
      color: #43e97b;
      text-decoration: none;
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    .flash {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .flash-success {
      background: #e6ffed;
      color: #2d7a46;
      border: 1px solid #2d7a46;
    }

    .flash-error {
      background: #ffe6e6;
      color: #a94442;
      border: 1px solid #a94442;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Mswaki Logo" class="auth-logo">
        <h1>Create Your Mswaki Account</h1>
        <p class="muted">Join Mswaki and manage your rides with ease</p>
      </div>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('routes.register') }}" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="role">Register As</label>
          <select id="role" name="role" required>
            <option value="">Select Role</option>
            <option value="passenger">Passenger</option>
            <option value="driver">Driver</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
        </div>

        <button type="submit" class="btn">Create Account</button>

        <p class="muted" style="text-align:center; margin-top:12px;">
          Already have an account?
          <a href="{{ url_for('routes.login') }}" class="link">Sign in here</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
