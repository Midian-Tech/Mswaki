{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block body_role %}error{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="error-page">
  <h1 class="error-code">404</h1>

</div>
{% endblock %}
