<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Misbehavior | Mswaki</title>
  <style>
    /* Reset and base */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("/static/images/mswaki.jpg") no-repeat center center fixed;
      background-size: cover; color:#fff; min-height:100vh;
    }

    /* Navbar */
    nav { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(0,0,0,0.7); position:relative; }
    nav .brand { font-size:1.8rem; font-weight:700; color:#00aaff; text-decoration:none; }
    nav .nav-links { display:flex; gap:1rem; align-items:center; }
    nav .nav-links a { color:#fff; padding:0.5rem 1rem; border-radius:5px; transition:0.3s; }
    nav .nav-links a:hover { background:#00aaff; color:#000; }
    nav .btn-primary { background:#00aaff; color:#000; font-weight:600; }
    .hamburger { display:none; flex-direction:column; cursor:pointer; gap:5px; }
    .hamburger span { width:25px; height:3px; background:#00aaff; border-radius:2px; }

    /* Container */
    .container { max-width:700px; margin:4rem auto; padding:2rem; background:rgba(0,0,0,0.7); border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,0.5); }
    .container h1 { text-align:center; margin-bottom:1rem; color:#00aaff; font-size:2rem; }
    .container p { text-align:center; margin-bottom:2rem; font-size:1.1rem; }

    /* Form */
    form div { margin-bottom:1.5rem; display:flex; flex-direction:column; }
    label { margin-bottom:0.5rem; font-weight:600; color:#00aaff; }
    select, textarea { padding:0.75rem; border-radius:8px; border:none; font-size:1rem; resize:vertical; }
    select:focus, textarea:focus { outline:2px solid #00aaff; }
    button[type="submit"] { width:100%; padding:0.8rem; background:#00aaff; color:#000; font-weight:700; font-size:1.1rem; border:none; border-radius:10px; cursor:pointer; transition:0.3s; }
    button[type="submit"]:hover { background:#0077cc; color:#fff; }

    .back-link { display:block; margin-top:1.5rem; text-align:center; color:#00aaff; text-decoration:none; font-weight:600; }
    .back-link:hover { text-decoration:underline; color:#0077cc; }

    /* Footer */
    footer { text-align:center; margin-top:3rem; padding:1rem; background:rgba(0,0,0,0.7); color:#aaa; font-size:0.9rem; }

    /* Responsive */
    @media (max-width: 768px) {
  .hamburger {
    display: flex;
  }

  .nav-links {
    position: absolute;
    top: 100%;
    right: 0;
    background: rgba(0,0,0,0.8);
    flex-direction: column;
    width: 200px;
    display: none; /* <-- hide initially */
    padding: 1rem;
  }

  .nav-links.active {
    display: flex; /* <-- show only when active */
  }

  .nav-links a {
    margin: 0.5rem 0;
  }
}
.nav-links {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.nav-links.active {
  max-height: 500px; /* enough to show all links */
}
  </style>
</head>
<body>

<nav>
  <a href="{{ url_for('routes.user_dashboard') }}" class="brand">Mswaki</a>
  <div class="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="nav-links" id="navLinks">
    <a href="{{ url_for('routes.user_dashboard') }}">Home</a>
    <a href="{{ url_for('routes.book_vehicle') }}">Book Ride</a>
    <a href="{{ url_for('routes.report_misbehavior') }}">Report</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('routes.logout') }}" class="btn btn-primary">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  <h1>Report Misbehavior</h1>
  <p>Your report will remain <strong>anonymous</strong>. Please provide as many details as possible.</p>

  <form method="POST">
    <div>
      <label for="driver_id">Driver Involved</label>
      <select name="driver_id" id="driver_id">
        <option value="">-- Select a Driver (optional) --</option>
        {% for driver in drivers %}
          <option value="{{ driver.id }}">{{ driver.name }} ({{ driver.email }})</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="vehicle_id">Vehicle Involved</label>
      <select name="vehicle_id" id="vehicle_id">
        <option value="">-- Select Vehicle (optional) --</option>
        {% for vehicle in vehicles %}
          <option value="{{ vehicle.id }}">{{ vehicle.plate_number }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="description">Incident Description</label>
      <textarea name="description" id="description" placeholder="Describe what happened..." required></textarea>
    </div>

    <button type="submit">Submit Report</button>
  </form>

  <a href="{{ url_for('routes.user_dashboard') }}" class="back-link">← Back to Dashboard</a>
</div>

<footer>
  &copy; {{ current_year or 2025 }} Mswaki Transport | All Rights Reserved
</footer>

<script>
  function toggleMenu() {
    const nav = document.getElementById('navLinks');
    nav.classList.toggle('active');
  }
</script>

</body>
</html>
